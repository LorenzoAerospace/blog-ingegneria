<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Inter, Arial, sans-serif"><rect width="800" height="450" rx="12" fill="#f8fafc"/><rect width="800" height="450" rx="12" fill="#f8fafc"/><rect x="20" y="18" width="760" height="126" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="40" y="44" font-size="14" font-weight="700" fill="#0284c7">1. Struttura isostatica originale</text><text x="40" y="62" font-size="12" fill="#64748b">Incastro a sinistra, cerniera interna al centro, carrello a destra</text><rect x="90" y="68" width="14" height="54" fill="#475569"/><line x1="90" y1="68" x2="82" y2="76" stroke="#475569" stroke-width="2"/><line x1="90" y1="81" x2="82" y2="89" stroke="#475569" stroke-width="2"/><line x1="90" y1="94" x2="82" y2="102" stroke="#475569" stroke-width="2"/><line x1="90" y1="107" x2="82" y2="115" stroke="#475569" stroke-width="2"/><line x1="104" y1="95" x2="380" y2="95" stroke="#0284c7" stroke-width="5" stroke-linecap="round"/><line x1="380" y1="95" x2="650" y2="95" stroke="#0284c7" stroke-width="5" stroke-linecap="round"/><circle cx="380" cy="95" r="6" fill="#ffffff" stroke="#0284c7" stroke-width="3"/><polygon points="650,99 639,117 661,117" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round"/><line x1="635" y1="123" x2="665" y2="123" stroke="#475569" stroke-width="2.5"/><line x1="515" y1="45" x2="515" y2="85" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/><polygon points="515,91 509,79 521,79" fill="#dc2626"/><text x="526" y="63" font-size="14" font-weight="700" fill="#dc2626">F</text><rect x="20" y="160" width="760" height="126" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="40" y="186" font-size="14" font-weight="700" fill="#0284c7">2. Riduzione a schema ad albero</text><text x="40" y="204" font-size="12" fill="#64748b">Sopprimo il carrello ed evidenzio la relativa reazione incognita R_B</text><rect x="90" y="210" width="14" height="54" fill="#475569"/><line x1="90" y1="210" x2="82" y2="218" stroke="#475569" stroke-width="2"/><line x1="90" y1="223" x2="82" y2="231" stroke="#475569" stroke-width="2"/><line x1="90" y1="236" x2="82" y2="244" stroke="#475569" stroke-width="2"/><line x1="90" y1="249" x2="82" y2="257" stroke="#475569" stroke-width="2"/><line x1="104" y1="237" x2="380" y2="237" stroke="#0284c7" stroke-width="5" stroke-linecap="round"/><line x1="380" y1="237" x2="650" y2="237" stroke="#0284c7" stroke-width="5" stroke-linecap="round"/><circle cx="380" cy="237" r="6" fill="#ffffff" stroke="#0284c7" stroke-width="3"/><line x1="515" y1="187" x2="515" y2="227" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/><polygon points="515,233 509,221 521,221" fill="#dc2626"/><text x="526" y="205" font-size="14" font-weight="700" fill="#dc2626">F</text><line x1="650" y1="276" x2="650" y2="247" stroke="#d97706" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 3"/><polygon points="650,241 644,253 656,253" fill="#d97706"/><text x="662" y="268" font-size="14" font-weight="700" fill="#d97706">R_B (incognita)</text><rect x="20" y="302" width="760" height="130" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="40" y="328" font-size="14" font-weight="700" fill="#059669">3. Struttura equivalente (aste unite / vincoli bloccati)</text><text x="40" y="346" font-size="12" fill="#64748b">Blocco la cerniera unendo le aste in un unico corpo rigido facile da leggere</text><rect x="90" y="354" width="14" height="54" fill="#475569"/><line x1="90" y1="354" x2="82" y2="362" stroke="#475569" stroke-width="2"/><line x1="90" y1="367" x2="82" y2="375" stroke="#475569" stroke-width="2"/><line x1="90" y1="380" x2="82" y2="388" stroke="#475569" stroke-width="2"/><line x1="90" y1="393" x2="82" y2="401" stroke="#475569" stroke-width="2"/><line x1="104" y1="381" x2="650" y2="381" stroke="#059669" stroke-width="6" stroke-linecap="round"/><rect x="352" y="371" width="56" height="20" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="380" y="385" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">UNITE</text><line x1="515" y1="331" x2="515" y2="371" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/><polygon points="515,377 509,365 521,365" fill="#dc2626"/><text x="526" y="349" font-size="14" font-weight="700" fill="#dc2626">F</text><line x1="650" y1="420" x2="650" y2="391" stroke="#d97706" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 3"/><polygon points="650,385 644,397 656,397" fill="#d97706"/><text x="662" y="412" font-size="14" font-weight="700" fill="#d97706">R_B</text></svg>