name: Aggiorna indice articoli
on:
  push:
    branches: [main]
    paths: ['Articles/**', 'legacy.json', 'scripts/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:            # evita due build contemporanee che si pestano i piedi
  group: build-index
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/build-index.js
      - name: Commit dei file generati
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          for f in articles.json sitemap.xml feed.xml robots.txt; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || (git commit -m "Aggiorna indice articoli" && git pull --rebase -X theirs && git push)
